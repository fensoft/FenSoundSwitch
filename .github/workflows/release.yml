name: FenSoundSwitch Release

on:
  push:
    branches:
      - master
    tags:
      - "[0-9]*.[0-9]*"
      - "v[0-9]*.[0-9]*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release installer
    if: github.ref == 'refs/heads/master'
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Install build dependencies
        run: python -m pip install -e .[build]

      - name: Build installer
        shell: powershell
        run: .\build_installer.ps1

      - name: Verify release asset
        shell: powershell
        run: |
          $asset = Resolve-Path .\dist\FenSoundSwitch.msi -ErrorAction Stop
          if ((Get-Item $asset).Length -le 0) {
              throw "Release installer is empty."
          }
          Resolve-Path .\dist\FenSoundSwitch\FenSoundSwitch.exe -ErrorAction Stop

  publish:
    name: Publish release installer
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Install build dependencies
        run: python -m pip install -e .[build]

      - name: Build installer
        shell: powershell
        run: .\build_installer.ps1 -Version $env:FENSOUNDSWITCH_BUILD_VERSION
        env:
          FENSOUNDSWITCH_BUILD_VERSION: ${{ github.ref_name }}

      - name: Verify release asset
        shell: powershell
        run: |
          $asset = Resolve-Path .\dist\FenSoundSwitch.msi -ErrorAction Stop
          if ((Get-Item $asset).Length -le 0) {
              throw "Release installer is empty."
          }
          Resolve-Path .\dist\FenSoundSwitch\FenSoundSwitch.exe -ErrorAction Stop

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FenSoundSwitch.msi
          generate_release_notes: true
