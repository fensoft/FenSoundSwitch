name: Release

on:
  push:
    branches:
      - master
    tags:
      - "**"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release executable
    if: github.ref == 'refs/heads/master'
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build dependencies
        run: python -m pip install -e .[build]

      - name: Build executable
        shell: powershell
        run: .\build_exe.ps1

      - name: Verify release asset
        shell: powershell
        run: |
          $asset = Resolve-Path .\dist\windows-ddc.exe -ErrorAction Stop
          if ((Get-Item $asset).Length -le 0) {
              throw "Release executable is empty."
          }

  publish:
    name: Publish release executable
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build dependencies
        run: python -m pip install -e .[build]

      - name: Build executable
        shell: powershell
        run: .\build_exe.ps1

      - name: Verify release asset
        shell: powershell
        run: |
          $asset = Resolve-Path .\dist\windows-ddc.exe -ErrorAction Stop
          if ((Get-Item $asset).Length -le 0) {
              throw "Release executable is empty."
          }

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/windows-ddc.exe
          generate_release_notes: true
