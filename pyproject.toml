[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fensoundswitch"
version = "0.1.0"
description = "FenSoundSwitch Windows monitor and receiver volume controller with tray and overlay UI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "monitorcontrol==4.2.0",
    "paho-mqtt==2.1.0",
    "pywebview==6.1",
    "pythonnet==3.0.5",
]

[project.optional-dependencies]
build = [
    "Nuitka==2.4.8",
]

[tool.setuptools]
py-modules = [
    "app",
    "app_version",
    "audio_outputs",
    "core_audio",
    "config_archive",
    "default",
    "autostart",
    "diagnostics",
    "gui",
    "ddc",
    "settings",
    "theme",
    "plugin_api",
    "plugin_hotkeys",
    "plugin_manager",
    "windows_platform",
    "web_presentation",
    "web_ui_host",
]

[tool.setuptools.package-data]
web = ["*.html", "*.css", "*.js"]

[tool.setuptools.packages.find]
include = ["plugins", "plugins.*", "web"]
